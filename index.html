<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آب‌رسان</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(#061b32,#0b4165);
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:94%;
    max-width:420px;
    text-align:center;
}

h1{
    margin:5px 0 10px;
    font-size:30px;
}

.info{
    display:flex;
    justify-content:space-between;
    background:#123653;
    padding:12px;
    border-radius:14px;
    margin-bottom:12px;
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    background:#041526;
    padding:6px;
    border-radius:16px;
}

.cell{
    aspect-ratio:1;
    background:#17476a;
    border-radius:8px;
    position:relative;
}

.pipe{
    position:absolute;
    inset:0;
    cursor:pointer;
}

.pipe::before,
.pipe::after{
    content:"";
    position:absolute;
    background:#43c9ff;
    border-radius:20px;
}

/* لوله مستقیم */

.straight::before{
    width:26%;
    height:100%;
    left:37%;
    top:0;
}

/* زانویی */

.corner::before{
    width:26%;
    height:63%;
    left:37%;
    top:0;
}

.corner::after{
    width:63%;
    height:26%;
    left:37%;
    top:37%;
}

/* منبع */

.source{
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:#168ee8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    z-index:5;
}

/* مخزن */

.target{
    position:absolute;
    inset:8%;
    border-radius:12px;
    background:#5b205f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    z-index:5;
}

.target.filled{
    background:linear-gradient(
        to top,
        #168ee8 70%,
        #5b205f 70%
    );
}

button{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:13px;
    background:#10a8ee;
    color:white;
    font-size:18px;
    font-weight:bold;
}

#message{
    min-height:28px;
    margin-top:10px;
    font-size:16px;
}

</style>
</head>

<body>

<div class="game">

<h1>💧 آب‌رسان</h1>

<div class="info">
    <span>مرحله ۱</span>
    <span id="moves">حرکت: ۰</span>
    <span id="stars">☆☆☆</span>
</div>

<div id="board" class="board"></div>

<div id="message">
    لوله‌ها را بچرخان و آب را به 😈 برسان!
</div>

<button onclick="sendWater()">
    💧 آب را برسان
</button>

<button onclick="resetGame()">
    🔄 شروع دوباره
</button>

</div>

<script>

/*
--------------------------------
مرحله اول
--------------------------------

مسیر صحیح:

💧 → → → ↘
          ↓
          ↓
          ↓
          ↓
          😈

*/

const level = [

    "source",
    "straight",
    "straight",
    "straight",
    "corner",

    "",
    "",
    "",
    "",
    "straight",

    "",
    "",
    "",
    "",
    "straight",

    "",
    "",
    "",
    "",
    "straight",

    "",
    "",
    "",
    "",
    "target"

];


/*
هر لوله چهار جهت دارد:

بالا = N
راست = E
پایین = S
چپ = W

*/

const board =
    document.getElementById("board");

const message =
    document.getElementById("message");

const movesText =
    document.getElementById("moves");

const starsText =
    document.getElementById("stars");

let rotations = [];

let moves = 0;


/*
ساخت صفحه
*/

function createGame(){
board.style.direction = "ltr";
    board.innerHTML="";

    rotations=[];

    moves=0;

    movesText.innerText="حرکت: ۰";

    starsText.innerText="☆☆☆";

    message.innerText=
        "لوله‌ها را بچرخان و آب را به 😈 برسان!";

    for(let i=0;i<25;i++){

        const cell=
            document.createElement("div");

        cell.className="cell";

        const type=level[i];

        if(type==="source"){

            const source=
                document.createElement("div");

            source.className="source";

            source.innerText="💧";

            cell.appendChild(source);

        }

        else if(type==="target"){

            const target=
                document.createElement("div");

            target.className="target";

            target.id="target";

            target.innerText="😈";

            cell.appendChild(target);

        }

        else if(type==="straight" ||
                type==="corner"){

            const pipe=
                document.createElement("div");

            pipe.className=
                "pipe "+type;

            pipe.dataset.index=i;

            if(i===1 || i===2 || i===3){
    rotations[i]=1;
}
else if(i===4){
    rotations[i]=2;
}
else{
    rotations[i]=0;
}

            pipe.onclick=function(){

                rotatePipe(i);

            };

            cell.appendChild(pipe);
        }

        board.appendChild(cell);
    }
}


/*
چرخاندن لوله
*/

function rotatePipe(index){

    rotations[index]++;

    if(rotations[index]>=4){

        rotations[index]=0;

    }

    const pipe=
        document.querySelector(
            '.pipe[data-index="'+index+'"]'
        );

    pipe.style.transform=
        "rotate("+
        (rotations[index]*90)+
        "deg)";

    moves++;

    movesText.innerText=
        "حرکت: "+moves;
}


/*
بررسی مسیر

برای این نسخه،
مسیر صحیح را مشخصاً بررسی می‌کنیم.
*/

function sendWater(){

    /*
    حالت صحیح مرحله:

    لوله‌های ردیف اول:
    مستقیم، مستقیم، مستقیم

    لوله گوشه:
    باید به سمت پایین باشد.

    سه لوله عمودی بعدی:
    مستقیم باشند.

    */

    const pipeIndexes=[
        1,
        2,
        3,
        4,
        9,
        14,
        19
    ];

    const correctRotations=[
        0,
        0,
        0,
        1,
        0,
        0,
        0
    ];

    let correct=true;

    for(let i=0;i<pipeIndexes.length;i++){

        if(
            rotations[pipeIndexes[i]]
            !==
            correctRotations[i]
        ){

            correct=false;

            break;
        }
    }

    if(correct){

        const target=
            document.getElementById("target");

        target.classList.add("filled");

        starsText.innerText="⭐⭐⭐";

        message.innerText=
            "🎉 عالی! آب به شیطان رسید!";

    }

    else{

        message.innerText=
            "💧 هنوز مسیر کامل نشده؛ لوله‌ها را بچرخان.";

    }
}


/*
شروع دوباره
*/

function resetGame(){

    createGame();

}


/*
اجرای بازی
*/

createGame();

</script>

</body>
</html>
