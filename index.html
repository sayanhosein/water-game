<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Runner</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  direction:ltr;
}

h1{
  margin:20px 0 5px;
  font-size:30px;
}

#levelTitle{
  margin-bottom:10px;
  color:#8bd3ff;
  font-size:18px;
}

#info{
  display:flex;
  justify-content:center;
  gap:25px;
  margin:10px;
  font-size:16px;
}

#game{
  width:360px;
  max-width:94vw;
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.cell{
  aspect-ratio:1;
  background:#1d293b;
  border-radius:9px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.pipe{
  width:70%;
  height:70%;
  position:relative;
  transition:transform .2s;
}

.pipe::before,
.pipe::after{
  content:"";
  position:absolute;
  background:#58c7ff;
  border-radius:8px;
}

.straight.vertical::before{
  width:25%;
  height:100%;
  left:37.5%;
  top:0;
}

.straight.horizontal::before{
  width:100%;
  height:25%;
  left:0;
  top:37.5%;
}

.corner.ne::before{
  width:25%;
  height:75%;
  left:37.5%;
  top:0;
}

.corner.ne::after{
  width:75%;
  height:25%;
  left:25%;
  top:37.5%;
}

.corner.se::before{
  width:25%;
  height:75%;
  left:37.5%;
  top:25%;
}

.corner.se::after{
  width:75%;
  height:25%;
  left:25%;
  top:37.5%;
}

.corner.sw::before{
  width:25%;
  height:75%;
  left:37.5%;
  top:25%;
}

.corner.sw::after{
  width:75%;
  height:25%;
  left:0;
  top:37.5%;
}

.corner.nw::before{
  width:25%;
  height:75%;
  left:37.5%;
  top:0;
}

.corner.nw::after{
  width:75%;
  height:25%;
  left:0;
  top:37.5%;
}

.source,
.target{
  font-size:32px;
}

.valve{
  width:72%;
  height:72%;
  position:relative;
}

.valve::before{
  content:"";
  position:absolute;
  width:24%;
  height:100%;
  left:38%;
  top:0;
  background:#58c7ff;
  border-radius:8px;
}

.valveCircle{
  position:absolute;
  width:48%;
  height:48%;
  left:26%;
  top:26%;
  border-radius:50%;
  background:#159447;
  border:4px solid white;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
}

.valve.closed .valveCircle{
  background:#e33b3b;
}

.valve.closed::before{
  background:#596579;
}

.water{
  position:absolute;
  background:#55d9ff;
  border-radius:50%;
  width:13px;
  height:13px;
  z-index:5;
  box-shadow:0 0 10px #55d9ff;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 22px;
  margin:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#resetBtn{
  background:#334155;
  color:white;
}

#nextBtn{
  background:#19a974;
  color:white;
  display:none;
}

#message{
  min-height:30px;
  font-size:18px;
  font-weight:bold;
  margin:10px;
}

.stars{
  font-size:25px;
  letter-spacing:4px;
}
</style>
</head>

<body>

<h1>💧 Water Runner</h1>

<div id="levelTitle">Level 1</div>

<div id="info">
  <div>Moves: <span id="moves">0</span></div>
  <div>Stars: <span id="stars">★★★</span></div>
</div>

<div id="game"></div>

<div id="message"></div>

<button id="resetBtn">RESET</button>
<button id="nextBtn">NEXT LEVEL</button>

<script>

const levels = [

/* =========================
   LEVEL 1
========================= */

[
  ["source",0],
  ["straight",0],
  ["corner",0],
  ["straight",0],
  ["corner",0],

  ["","0"],
  ["","0"],
  ["","0"],
  ["straight",1],
  ["corner",1],

  ["","0"],
  ["","0"],
  ["","0"],
  ["","0"],
  ["straight",0],

  ["","0"],
  ["","0"],
  ["","0"],
  ["","0"],
  ["corner",2],

  ["","0"],
  ["","0"],
  ["","0"],
  ["","0"],
  ["target",0]
],

/* =========================
   LEVEL 2
========================= */

[
  ["source",0],
  ["corner",0],
  ["straight",0],
  ["","0"],
  ["","0"],

  ["","0"],
  ["","0"],
  ["corner",1],
  ["straight",1],
  ["","0"],

  ["","0"],
  ["","0"],
  ["straight",0],
  ["","0"],
  ["","0"],

  ["","0"],
  ["","0"],
  ["corner",2],
  ["straight",0],
  ["","0"],

  ["","0"],
  ["","0"],
  ["","0"],
  ["corner",3],
  ["target",0]
],

/* =========================
   LEVEL 3 - REAL VALVE
========================= */

[
  ["source",0],
  ["valve",0,true],
  ["straight",0],
  ["","0"],
  ["","0"],

  ["","0"],
  ["","0"],
  ["corner",1],
  ["","0"],
  ["","0"],

  ["","0"],
  ["","0"],
  ["straight",0],
  ["","0"],
  ["","0"],

  ["","0"],
  ["","0"],
  ["corner",0],
  ["straight",0],
  ["","0"],

  ["","0"],
  ["","0"],
  ["","0"],
  ["corner",3],
  ["target",0]
]

];

let currentLevel = 0;
let board = [];
let moves = 0;
let completed = false;


/* =========================
   CONNECTIONS
========================= */

function getConnections(type,rotation){

  if(type==="straight"){

    if(rotation%2===0){
      return [true,false,true,false];
    }else{
      return [false,true,false,true];
    }

  }

  if(type==="corner"){

    const corners=[
      [true,true,false,false],
      [false,true,true,false],
      [false,false,true,true],
      [true,false,false,true]
    ];

    return corners[rotation%4];

  }

  if(type==="valve"){

    if(rotation%2===0){
      return [true,false,true,false];
    }else{
      return [false,true,false,true];
    }

  }

  if(type==="source"){
    return [false,true,false,false];
  }

  if(type==="target"){
    return [false,false,false,true];
  }

  return [false,false,false,false];
}


/* =========================
   DRAW BOARD
========================= */

function drawBoard(){

  const game=document.getElementById("game");
  game.innerHTML="";

  board.forEach((item,index)=>{

    const cell=document.createElement("div");
    cell.className="cell";

    const type=item.type;
    const rotation=item.rotation;

    if(type==="source"){
      cell.innerHTML="💧";
    }

    else if(type==="target"){
      cell.innerHTML="😈";
    }

    else if(type==="straight"){

      const pipe=document.createElement("div");
      pipe.className="pipe straight";

      if(rotation%2===0)
        pipe.classList.add("vertical");
      else
        pipe.classList.add("horizontal");

      cell.appendChild(pipe);
    }

    else if(type==="corner"){

      const pipe=document.createElement("div");
      pipe.className="pipe corner";

      const names=["ne","se","sw","nw"];
      pipe.classList.add(names[rotation%4]);

      cell.appendChild(pipe);
    }

    else if(type==="valve"){

      const valve=document.createElement("div");
      valve.className="valve";

      if(!item.open){
        valve.classList.add("closed");
      }

      const circle=document.createElement("div");
      circle.className="valveCircle";
      circle.textContent=item.open ? "OPEN" : "CLOSED";

      valve.appendChild(circle);
      cell.appendChild(valve);
    }

    cell.addEventListener("click",()=>handleClick(index));

    game.appendChild(cell);
  });

}


/* =========================
   CLICK
========================= */

function handleClick(index){

  if(completed) return;

  const item=board[index];

  if(!item.type) return;

  if(item.type==="source" || item.type==="target"){
    return;
  }

  /* VALVE */

  if(item.type==="valve"){

    item.open=!item.open;

    moves++;

    updateInfo();
    drawBoard();

    checkPath();

    return;
  }

  /* NORMAL PIPE */

  item.rotation=(item.rotation+1)%4;

  moves++;

  updateInfo();
  drawBoard();

  checkPath();
}


/* =========================
   PATH FINDING
========================= */

function getPath(){

  const start=board.findIndex(x=>x.type==="source");
  const target=board.findIndex(x=>x.type==="target");

  const queue=[start];
  const visited=new Set([start]);
  const parent={};

  const dirs=[
    [-1,0],
    [0,1],
    [1,0],
    [0,-1]
  ];

  while(queue.length){

    const current=queue.shift();

    if(current===target){

      const path=[];
      let p=current;

      while(p!==undefined){

        path.unshift(p);
        p=parent[p];
      }

      return path;
    }

    const row=Math.floor(current/5);
    const col=current%5;

    const currentItem=board[current];

    if(currentItem.type==="valve" && !currentItem.open){
      continue;
    }

    const connections=getConnections(
      currentItem.type,
      currentItem.rotation
    );

    for(let d=0;d<4;d++){

      if(!connections[d]) continue;

      const nr=row+dirs[d][0];
      const nc=col+dirs[d][1];

      if(nr<0 || nr>=5 || nc<0 || nc>=5)
        continue;

      const next=nr*5+nc;

      if(visited.has(next))
        continue;

      const nextItem=board[next];

      if(!nextItem.type)
        continue;

      if(nextItem.type==="valve" && !nextItem.open)
        continue;

      const opposite=(d+2)%4;

      const nextConnections=getConnections(
        nextItem.type,
        nextItem.rotation
      );

      if(!nextConnections[opposite])
        continue;

      visited.add(next);
      parent[next]=current;
      queue.push(next);
    }
  }

  return null;
}


/* =========================
   CHECK PATH
========================= */

function checkPath(){

  const path=getPath();

  if(!path) return;

  completed=true;

  animateWater(path);
}


/* =========================
   WATER ANIMATION
========================= */

function animateWater(path){

  const cells=document.querySelectorAll(".cell");

  let i=0;

  function moveWater(){

    if(i>=path.length){

      setTimeout(levelComplete,400);

      return;
    }

    const cell=cells[path[i]];

    const water=document.createElement("div");
    water.className="water";

    cell.appendChild(water);

    i++;

    setTimeout(moveWater,180);
  }

  moveWater();
}


/* =========================
   LEVEL COMPLETE
========================= */

function levelComplete(){

  document.getElementById("message").textContent=
    "💦 Water reached the chamber!";

  calculateStars();

  if(currentLevel<levels.length-1){

    document.getElementById("nextBtn").style.display="inline-block";

  }else{

    document.getElementById("message").textContent=
      "🎉 All available levels completed!";
  }
}


/* =========================
   STARS
========================= */

function calculateStars(){

  let result="★★★";

  if(moves>14){
    result="★★☆";
  }

  if(moves>22){
    result="★☆☆";
  }

  document.getElementById("stars").textContent=result;
}


/* =========================
   INFO
========================= */

function updateInfo(){

  document.getElementById("moves").textContent=moves;

}


/* =========================
   LOAD LEVEL
========================= */

function loadLevel(level){

  currentLevel=level;

  moves=0;
  completed=false;

  document.getElementById("levelTitle").textContent=
    "Level "+(currentLevel+1);

  document.getElementById("message").textContent="";

  document.getElementById("nextBtn").style.display="none";

  document.getElementById("stars").textContent="★★★";

  board=levels[currentLevel].map(item=>{

    return {
      type:item[0],
      rotation:Number(item[1]) || 0,
      open:item[2]===undefined ? true : item[2]
    };

  });

  updateInfo();
  drawBoard();
}


/* =========================
   RESET
========================= */

document.getElementById("resetBtn").addEventListener("click",()=>{

  loadLevel(currentLevel);

});


/* =========================
   NEXT
========================= */

document.getElementById("nextBtn").addEventListener("click",()=>{

  if(currentLevel<levels.length-1){

    loadLevel(currentLevel+1);

  }

});


/* =========================
   START
========================= */

loadLevel(0);

</script>

</body>
</html>
