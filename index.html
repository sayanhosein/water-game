<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Runner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#101827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:20px 0 5px;
    font-size:30px;
}

.level{
    color:#65cfff;
    font-size:21px;
    margin-bottom:12px;
}

.info{
    display:flex;
    justify-content:center;
    gap:35px;
    font-size:18px;
    margin-bottom:15px;
}

#game{
    width:360px;
    max-width:94vw;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.cell{
    aspect-ratio:1;
    background:#1d293b;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    cursor:pointer;
}

/* =====================
   SOURCE
===================== */

.source{
    font-size:34px;
}

/* =====================
   TARGET
===================== */

.target{
    font-size:32px;
}

/* =====================
   PIPE
===================== */

.pipe{
    width:72%;
    height:72%;
    position:relative;
}

/* =====================
   STRAIGHT
===================== */

.straight:before{
    content:"";
    position:absolute;
    background:#59caff;
    border-radius:8px;
}

.straight.vertical:before{
    width:25%;
    height:100%;
    left:37.5%;
    top:0;
}

.straight.horizontal:before{
    width:100%;
    height:25%;
    left:0;
    top:37.5%;
}

/* =====================
   CORNER
===================== */

.corner:before,
.corner:after{
    content:"";
    position:absolute;
    background:#59caff;
    border-radius:8px;
}

/* NE */

.corner.ne:before{
    width:25%;
    height:75%;
    left:37.5%;
    top:0;
}

.corner.ne:after{
    width:75%;
    height:25%;
    left:25%;
    top:37.5%;
}

/* SE */

.corner.se:before{
    width:25%;
    height:75%;
    left:37.5%;
    top:25%;
}

.corner.se:after{
    width:75%;
    height:25%;
    left:25%;
    top:37.5%;
}

/* SW */

.corner.sw:before{
    width:25%;
    height:75%;
    left:37.5%;
    top:25%;
}

.corner.sw:after{
    width:75%;
    height:25%;
    left:0;
    top:37.5%;
}

/* NW */

.corner.nw:before{
    width:25%;
    height:75%;
    left:37.5%;
    top:0;
}

.corner.nw:after{
    width:75%;
    height:25%;
    left:0;
    top:37.5%;
}

/* =====================
   WATER
===================== */

.water{
    position:absolute;

    width:14px;
    height:14px;

    background:#65e0ff;

    border-radius:50%;

    box-shadow:0 0 12px #65e0ff;

    z-index:10;
}

/* =====================
   BUTTONS
===================== */

button{
    border:0;
    border-radius:10px;

    padding:13px 28px;

    margin:18px 5px;

    font-size:17px;
    font-weight:bold;
}

#reset{
    background:#34455c;
    color:white;
}

#next{
    background:#19a974;
    color:white;

    display:none;
}

#message{
    min-height:30px;
    margin-top:10px;

    font-size:18px;
    font-weight:bold;
}

</style>
</head>


<body>

<h1>💧 Water Runner</h1>

<div class="level">
    Level 1
</div>

<div class="info">

    <div>
        Moves:
        <span id="moves">0</span>
    </div>

    <div>
        Stars:
        <span id="stars">★★★</span>
    </div>

</div>


<div id="game"></div>

<div id="message"></div>

<button id="reset">
    RESET
</button>

<button id="next">
    NEXT LEVEL
</button>


<script>

/*
========================================
DIRECTIONS

0 = NORTH
1 = EAST
2 = SOUTH
3 = WEST
========================================
*/


/*
========================================
LEVEL 1

CORRECT PATH:

💧 ─ ─ ┐
      │
      │
└ ─ ─ ┘
      │
      😈
========================================
*/


const level = [

    /* ROW 1 */

    {type:"source", rotation:0},

    {type:"straight", rotation:0},

    {type:"corner", rotation:3},

    {type:"empty"},

    {type:"empty"},


    /* ROW 2 */

    {type:"empty"},

    {type:"empty"},

    {type:"straight", rotation:1},

    {type:"empty"},

    {type:"empty"},


    /* ROW 3 */

    {type:"empty"},

    {type:"empty"},

    {type:"straight", rotation:0},

    {type:"empty"},

    {type:"empty"},


    /* ROW 4 */

    {type:"corner", rotation:3},

    {type:"straight", rotation:1},

    {type:"corner", rotation:0},

    {type:"empty"},

    {type:"empty"},


    /* ROW 5 */

    {type:"target"},

    {type:"empty"},

    {type:"empty"},

    {type:"empty"},

    {type:"empty"}

];


/*
========================================
GAME
========================================
*/

let board = [];

let moves = 0;

let finished = false;


/*
========================================
CONNECTIONS
========================================
*/

function getConnections(type,rotation){

    /* STRAIGHT */

    if(type === "straight"){

        if(rotation % 2 === 0){

            return [
                true,
                false,
                true,
                false
            ];

        }

        return [
            false,
            true,
            false,
            true
        ];
    }


    /* CORNER */

    if(type === "corner"){

        const shapes = [

            /* 0 = NE */
            [true,true,false,false],

            /* 1 = SE */
            [false,true,true,false],

            /* 2 = SW */
            [false,false,true,true],

            /* 3 = NW */
            [true,false,false,true]

        ];

        return shapes[rotation % 4];
    }


    /* SOURCE */

    if(type === "source"){

        return [
            false,
            true,
            false,
            false
        ];
    }


    /* TARGET */

    if(type === "target"){

        return [
            true,
            false,
            false,
            false
        ];
    }


    return [
        false,
        false,
        false,
        false
    ];
}


/*
========================================
DRAW
========================================
*/

function draw(){

    const game =
        document.getElementById("game");

    game.innerHTML="";


    board.forEach((item,index)=>{

        const cell =
            document.createElement("div");

        cell.className="cell";


        /* SOURCE */

        if(item.type==="source"){

            cell.innerHTML=
                '<div class="source">💧</div>';

        }


        /* TARGET */

        else if(item.type==="target"){

            cell.innerHTML=
                '<div class="target">😈</div>';

        }


        /* STRAIGHT */

        else if(item.type==="straight"){

            const pipe=
                document.createElement("div");

            pipe.className="pipe straight";


            if(item.rotation % 2 === 0){

                pipe.classList.add("vertical");

            }else{

                pipe.classList.add("horizontal");

            }


            cell.appendChild(pipe);

        }


        /* CORNER */

        else if(item.type==="corner"){

            const pipe=
                document.createElement("div");

            pipe.className="pipe corner";


            const names=[
                "ne",
                "se",
                "sw",
                "nw"
            ];


            pipe.classList.add(
                names[item.rotation]
            );


            cell.appendChild(pipe);

        }


        /* CLICK */

        cell.onclick=function(){

            rotate(index);

        };


        game.appendChild(cell);

    });

}


/*
========================================
ROTATE
========================================
*/

function rotate(index){

    if(finished)
        return;


    const item=board[index];


    if(
        item.type!=="straight" &&
        item.type!=="corner"
    ){

        return;

    }


    item.rotation=
        (item.rotation+1)%4;


    moves++;


    document.getElementById("moves")
        .textContent=moves;


    draw();


    check();

}


/*
========================================
PATH FINDER
========================================
*/

function findPath(){

    const start=
        board.findIndex(
            x=>x.type==="source"
        );


    const target=
        board.findIndex(
            x=>x.type==="target"
        );


    const queue=[start];

    const visited=
        new Set([start]);


    const parent={};


    const directions=[

        [-1,0],

        [0,1],

        [1,0],

        [0,-1]

    ];


    while(queue.length){

        const current=
            queue.shift();


        if(current===target){

            const path=[];

            let p=current;


            while(p!==undefined){

                path.unshift(p);

                p=parent[p];

            }


            return path;

        }


        const row=
            Math.floor(current/5);

        const col=
            current%5;


        const item=
            board[current];


        const con=
            getConnections(
                item.type,
                item.rotation
            );


        for(let d=0;d<4;d++){

            if(!con[d])
                continue;


            const nr=
                row+directions[d][0];

            const nc=
                col+directions[d][1];


            if(
                nr<0 ||
                nr>=5 ||
                nc<0 ||
                nc>=5
            )
                continue;


            const next=
                nr*5+nc;


            if(visited.has(next))
                continue;


            const nextItem=
                board[next];


            if(
                !nextItem ||
                nextItem.type==="empty"
            )
                continue;


            const opposite=
                (d+2)%4;


            const nextCon=
                getConnections(
                    nextItem.type,
                    nextItem.rotation
                );


            if(!nextCon[opposite])
                continue;


            visited.add(next);

            parent[next]=current;

            queue.push(next);

        }

    }


    return null;

}


/*
========================================
CHECK
========================================
*/

function check(){

    const path=findPath();


    if(!path)
        return;


    finished=true;


    animate(path);

}


/*
========================================
WATER
========================================
*/

function animate(path){

    const cells=
        document.querySelectorAll(".cell");


    let i=0;


    function step(){

        if(i>=path.length){

            setTimeout(
                complete,
                400
            );

            return;

        }


        const water=
            document.createElement("div");


        water.className="water";


        cells[path[i]]
            .appendChild(water);


        i++;


        setTimeout(
            step,
            200
        );

    }


    step();

}


/*
========================================
COMPLETE
========================================
*/

function complete(){

    document.getElementById("message")
        .textContent=
        "💦 Water reached the chamber!";


    let stars="★★★";


    if(moves>12)
        stars="★★☆";


    if(moves>20)
        stars="★☆☆";


    document.getElementById("stars")
        .textContent=stars;


    document.getElementById("next")
        .style.display="inline-block";

}


/*
========================================
RESET
========================================
*/

document.getElementById("reset")
    .onclick=function(){

        moves=0;

        finished=false;


        document.getElementById("moves")
            .textContent="0";


        document.getElementById("stars")
            .textContent="★★★";


        document.getElementById("message")
            .textContent="";


        document.getElementById("next")
            .style.display="none";


        board=
            level.map(item=>({

                type:item.type,

                rotation:item.rotation

            }));


        draw();

    };


/*
========================================
START
========================================
*/

board=
    level.map(item=>({

        type:item.type,

        rotation:item.rotation

    }));


draw();

</script>

</body>
</html>
