<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Water Runner</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;

    background:
        linear-gradient(
            180deg,
            #061b32 0%,
            #0b4165 100%
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;

    direction:ltr;
}

.game{
    width:100%;
    max-width:430px;
    text-align:center;
}

.title{
    font-size:32px;
    font-weight:bold;
    margin:5px 0 15px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#153d5d;

    padding:14px 16px;

    border-radius:16px;

    margin-bottom:14px;

    font-size:17px;
}

.stars{
    letter-spacing:2px;
    font-size:21px;
}

.board{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:5px;

    background:#041526;

    padding:7px;

    border-radius:18px;

    direction:ltr;
}

.cell{
    aspect-ratio:1;

    position:relative;

    background:#174b6e;

    border-radius:9px;

    overflow:hidden;
}

/* =========================
   PIPE
========================= */

.pipe{
    position:absolute;

    inset:0;

    cursor:pointer;

    transition:
        transform .25s ease,
        filter .25s ease;
}

/* Straight pipe
   Default = vertical
*/

.pipe.straight::before{

    content:"";

    position:absolute;

    width:25%;

    height:100%;

    left:37.5%;

    top:0;

    background:#48c8f7;

    border-radius:30px;
}

/* Corner pipe
   Default = TOP + RIGHT
*/

.pipe.corner::before{

    content:"";

    position:absolute;

    width:25%;

    height:65%;

    left:37.5%;

    top:0;

    background:#48c8f7;

    border-radius:30px;
}

.pipe.corner::after{

    content:"";

    position:absolute;

    width:65%;

    height:25%;

    left:37.5%;

    top:37.5%;

    background:#48c8f7;

    border-radius:30px;
}

/* =========================
   SOURCE
========================= */

.source{

    position:absolute;

    inset:9%;

    border-radius:50%;

    background:#168ee8;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    z-index:5;
}

/* =========================
   TARGET
========================= */

.target{

    position:absolute;

    inset:8%;

    border-radius:13px;

    background:#5b205f;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:31px;

    z-index:5;

    transition:
        background .5s ease,
        box-shadow .5s ease;
}

.target.filled{

    background:
        linear-gradient(
            to top,
            #159be8 0%,
            #159be8 72%,
            #5b205f 72%,
            #5b205f 100%
        );

    box-shadow:
        0 0 20px rgba(30,180,255,.7);
}

/* =========================
   WATER PATH
========================= */

.pipe.water{

    filter:
        drop-shadow(
            0 0 7px
            rgba(50,210,255,.9)
        );
}

.pipe.water::before,
.pipe.water::after{

    background:#8ee8ff;
}

/* =========================
   MESSAGE
========================= */

.message{

    min-height:32px;

    margin:12px 0 4px;

    font-size:17px;

    font-weight:bold;
}

/* =========================
   BUTTONS
========================= */

button{

    width:100%;

    border:0;

    border-radius:15px;

    padding:15px;

    margin-top:10px;

    font-size:18px;

    font-weight:bold;

    color:white;

    background:#12a8ed;

    cursor:pointer;

    box-shadow:
        0 4px 0 #087db3;

    transition:
        transform .1s ease,
        box-shadow .1s ease;
}

button:active{

    transform:translateY(3px);

    box-shadow:
        0 1px 0 #087db3;
}

.reset{

    background:#237394;

    box-shadow:
        0 4px 0 #18566f;
}

</style>

</head>

<body>

<div class="game">

    <div class="title">
        💧 Water Runner
    </div>

    <div class="header">

        <span>
            Level <b>1</b>
        </span>

        <span
            id="stars"
            class="stars"
        >
            ☆☆☆
        </span>

        <span id="moves">
            Moves: 0
        </span>

    </div>

    <div
        id="board"
        class="board"
    ></div>

    <div
        id="message"
        class="message"
    >
        Rotate the pipes and connect the water to 😈
    </div>

    <button
        onclick="sendWater()"
    >
        💧 SEND WATER
    </button>

    <button
        class="reset"
        onclick="resetGame()"
    >
        🔄 RESET
    </button>

</div>


<script>

/* ==========================================
   LEVEL 1
==========================================

   The correct path is:

   💧 ─ ─ ─ ┐
             │
             │
             │
             😈

   The player must rotate:

   Pipe 1 → 90°
   Pipe 2 → 90°
   Pipe 3 → 90°
   Corner → 180°

========================================== */

const level = [

    "source",       // 0
    "straight",     // 1
    "straight",     // 2
    "straight",     // 3
    "corner",       // 4

    "",             // 5
    "",             // 6
    "",             // 7
    "",             // 8
    "straight",     // 9

    "",             // 10
    "",             // 11
    "",             // 12
    "",             // 13
    "straight",     // 14

    "",             // 15
    "",             // 16
    "",             // 17
    "",             // 18
    "straight",     // 19

    "",             // 20
    "",             // 21
    "",             // 22
    "",             // 23
    "target"        // 24
];


/*
   Starting rotations.

   Straight pipe:
   0 = vertical
   1 = horizontal

   Corner:
   0 = top + right
   1 = right + bottom
   2 = bottom + left
   3 = left + top

   Therefore the correct solution is:

   Pipe 1 = 1
   Pipe 2 = 1
   Pipe 3 = 1
   Corner = 2
*/

const rotations = new Array(25).fill(0);


/*
   Correct solution.
*/

const solution = {

    1:1,
    2:1,
    3:1,
    4:2,
    9:0,
    14:0,
    19:0

};


let moves = 0;


/* ==========================================
   ELEMENTS
========================================== */

const board =
    document.getElementById("board");

const message =
    document.getElementById("message");

const movesElement =
    document.getElementById("moves");

const starsElement =
    document.getElementById("stars");


/* ==========================================
   CREATE GAME
========================================== */

function createGame(){

    board.innerHTML = "";

    moves = 0;

    movesElement.innerText =
        "Moves: 0";

    starsElement.innerText =
        "☆☆☆";

    message.innerText =
        "Rotate the pipes and connect the water to 😈";


    /*
       IMPORTANT:
       The first three pipes start vertical.

       The corner starts in the wrong direction.

       This creates an actual puzzle.
    */

    for(let i = 0; i < 25; i++){

        const cell =
            document.createElement("div");

        cell.className = "cell";


        const type = level[i];


        /* SOURCE */

        if(type === "source"){

            const source =
                document.createElement("div");

            source.className =
                "source";

            source.innerText =
                "💧";

            cell.appendChild(source);
        }


        /* TARGET */

        else if(type === "target"){

            const target =
                document.createElement("div");

            target.className =
                "target";

            target.id =
                "target";

            target.innerText =
                "😈";

            cell.appendChild(target);
        }


        /* PIPE */

        else if(
            type === "straight" ||
            type === "corner"
        ){

            const pipe =
                document.createElement("div");

            pipe.className =
                "pipe " + type;

            pipe.dataset.index =
                i;

            pipe.style.transform =
                "rotate(0deg)";


            pipe.addEventListener(
                "click",
                function(){

                    rotatePipe(i);

                }
            );


            cell.appendChild(pipe);
        }


        board.appendChild(cell);
    }
}


/* ==========================================
   ROTATE PIPE
========================================== */

function rotatePipe(index){

    rotations[index]++;

    if(rotations[index] >= 4){

        rotations[index] = 0;

    }


    const pipe =
        document.querySelector(
            '.pipe[data-index="' +
            index +
            '"]'
        );


    pipe.style.transform =
        "rotate(" +
        (rotations[index] * 90) +
        "deg)";


    moves++;


    movesElement.innerText =
        "Moves: " + moves;


    /*
       Remove previous water effect
       if player changes the puzzle.
    */

    clearWater();


    const target =
        document.getElementById("target");

    target.classList.remove("filled");


    starsElement.innerText =
        "☆☆☆";


    message.innerText =
        "Rotate the pipes and connect the water to 😈";
}


/* ==========================================
   PIPE CONNECTIONS
==========================================

   Order:

   0 = TOP
   1 = RIGHT
   2 = BOTTOM
   3 = LEFT

========================================== */

function getConnections(
    type,
    rotation
){

    let connections;


    /*
       STRAIGHT

       Default:
       TOP + BOTTOM
    */

    if(type === "straight"){

        connections =
            [1,0,1,0];

    }


    /*
       CORNER

       Default:
       TOP + RIGHT
    */

    else if(type === "corner"){

        connections =
            [1,1,0,0];

    }

    else{

        connections =
            [0,0,0,0];

    }


    /*
       Rotate clockwise.
    */

    for(
        let i = 0;
        i < rotation;
        i++
    ){

        connections = [

            connections[3],
            connections[0],
            connections[1],
            connections[2]

        ];

    }


    return connections;
}


/* ==========================================
   FIND WATER PATH
========================================== */

function findPath(){

    const visited =
        new Set();

    const queue = [];


    /*
       Source is at:

       row 0
       column 0
    */

    queue.push({
        row:0,
        col:0
    });


    visited.add("0,0");


    const path = [];


    while(queue.length > 0){

        const current =
            queue.shift();


        const row =
            current.row;

        const col =
            current.col;


        const index =
            row * 5 + col;


        path.push(index);


        /*
           Target reached.
        */

        if(level[index] === "target"){

            return path;

        }


        /*
           Four directions.

           TOP
           RIGHT
           BOTTOM
           LEFT
        */

        const directions = [

            [-1,0,0,2],

            [0,1,1,3],

            [1,0,2,0],

            [0,-1,3,1]

        ];


        for(
            const direction
            of directions
        ){

            const newRow =
                row + direction[0];

            const newCol =
                col + direction[1];

            const currentSide =
                direction[2];

            const oppositeSide =
                direction[3];


            /*
               Outside board.
            */

            if(
                newRow < 0 ||
                newRow >= 5 ||
                newCol < 0 ||
                newCol >= 5
            ){

                continue;

            }


            const newIndex =
                newRow * 5 + newCol;


            /*
               Don't enter empty cells.
            */

            if(
                level[newIndex] === ""
            ){

                continue;

            }


            /*
               SOURCE connections.

               Water exits source
               through RIGHT.
            */

            let currentConnections;


            if(level[index] === "source"){

                currentConnections =
                    [0,1,0,0];

            }

            else{

                currentConnections =
                    getConnections(
                        level[index],
                        rotations[index]
                    );

            }


            /*
               TARGET accepts water
               from TOP.
            */

            let nextConnections;


            if(level[newIndex] === "target"){

                nextConnections =
                    [1,0,0,0];

            }

            else{

                nextConnections =
                    getConnections(
                        level[newIndex],
                        rotations[newIndex]
                    );

            }


            /*
               Both pipes must connect.
            */

            if(
                currentConnections[currentSide] &&
                nextConnections[oppositeSide]
            ){

                const key =
                    newRow + "," + newCol;


                if(!visited.has(key)){

                    visited.add(key);

                    queue.push({

                        row:newRow,
                        col:newCol

                    });

                }

            }

        }

    }


    return null;
}


/* ==========================================
   SEND WATER
========================================== */

function sendWater(){

    clearWater();


    const path =
        findPath();


    /*
       No path.
    */

    if(!path){

        message.innerText =
            "💧 The path is not complete. Rotate the pipes.";

        starsElement.innerText =
            "☆☆☆";

        return;
    }


    /*
       WATER REACHED TARGET
    */

    animateWater(path);

}


/* ==========================================
   WATER ANIMATION
========================================== */

function animateWater(path){

    message.innerText =
        "💧 Water is flowing...";


    let position = 0;


    const timer =
        setInterval(function(){

            if(position >= path.length){

                clearInterval(timer);

                finishLevel();

                return;

            }


            const index =
                path[position];


            const pipe =
                document.querySelector(
                    '.pipe[data-index="' +
                    index +
                    '"]'
                );


            if(pipe){

                pipe.classList.add(
                    "water"
                );

            }


            position++;

        },120);

}


/* ==========================================
   LEVEL COMPLETE
========================================== */

function finishLevel(){

    const target =
        document.getElementById("target");


    target.classList.add(
        "filled"
    );


    let stars = 3;


    /*
       Fewer moves = more stars.
    */

    if(moves > 6){

        stars = 2;

    }

    if(moves > 9){

        stars = 1;

    }


    starsElement.innerText =
        "⭐".repeat(stars) +
        "☆".repeat(3 - stars);


    message.innerText =
        "🎉 Great! You delivered the water!";


}


/* ==========================================
   CLEAR WATER
========================================== */

function clearWater(){

    document
        .querySelectorAll(".pipe.water")
        .forEach(function(pipe){

            pipe.classList.remove(
                "water"
            );

        });

}


/* ==========================================
   RESET
========================================== */

function resetGame(){

    for(let i = 0; i < 25; i++){

        rotations[i] = 0;

    }


    clearWater();


    const target =
        document.getElementById("target");


    if(target){

        target.classList.remove(
            "filled"
        );

    }


    createGame();

}


/* ==========================================
   START
========================================== */

createGame();

</script>

</body>
</html>
