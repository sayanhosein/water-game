<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Runner</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#101827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:20px 0 5px;
    font-size:32px;
}

.level{
    color:#65cfff;
    font-size:24px;
    margin-bottom:14px;
}

.info{
    display:flex;
    justify-content:center;
    gap:40px;
    font-size:20px;
    margin-bottom:18px;
}

#game{
    width:360px;
    max-width:94vw;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.cell{
    aspect-ratio:1;
    background:#1d293b;
    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    cursor:pointer;
}

.source{
    font-size:38px;
}

.target{
    font-size:38px;
}


/* =========================
   PIPE
========================= */

.pipe{
    width:72%;
    height:72%;
    position:relative;
}


/* =========================
   STRAIGHT
========================= */

.straight::before{
    content:"";
    position:absolute;
    background:#59caff;
    border-radius:10px;
}

.straight.vertical::before{
    width:25%;
    height:100%;
    left:37.5%;
    top:0;
}

.straight.horizontal::before{
    width:100%;
    height:25%;
    left:0;
    top:37.5%;
}


/* =========================
   CORNER

   Base shape:
   EAST + SOUTH

   Rotation:
   0 = EAST + SOUTH
   1 = SOUTH + WEST
   2 = WEST + NORTH
   3 = NORTH + EAST
========================= */

.corner{
    transform-origin:center;
}

.corner::before,
.corner::after{
    content:"";
    position:absolute;
    background:#59caff;
    border-radius:10px;
}


/* Base = EAST + SOUTH */

.corner::before{
    width:25%;
    height:75%;
    left:37.5%;
    top:25%;
}

.corner::after{
    width:75%;
    height:25%;
    left:25%;
    top:37.5%;
}

.corner.r0{
    transform:rotate(0deg);
}

.corner.r1{
    transform:rotate(90deg);
}

.corner.r2{
    transform:rotate(180deg);
}

.corner.r3{
    transform:rotate(270deg);
}


/* =========================
   WATER
========================= */

.water{
    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:#65e0ff;

    box-shadow:
        0 0 8px #65e0ff,
        0 0 18px #65e0ff;

    z-index:20;

    animation:pulse .5s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(.8);
    }
    to{
        transform:scale(1.2);
    }
}


/* =========================
   BUTTONS
========================= */

button{
    border:0;
    border-radius:12px;

    padding:14px 30px;

    margin:20px 5px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

#reset{
    background:#34455c;
    color:white;
}

#next{
    background:#19a974;
    color:white;
    display:none;
}

#message{
    min-height:30px;
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>


<body>

<h1>💧 Water Runner</h1>

<div class="level" id="levelTitle">
    Level 1
</div>

<div class="info">

    <div>
        Moves:
        <span id="moves">0</span>
    </div>

    <div>
        Stars:
        <span id="stars">★★★</span>
    </div>

</div>


<div id="game"></div>

<div id="message"></div>

<button id="reset">
    RESET
</button>

<button id="next">
    NEXT LEVEL
</button>


<script>

/* =====================================================
   DIRECTIONS

   0 = NORTH
   1 = EAST
   2 = SOUTH
   3 = WEST
===================================================== */


/* =====================================================
   LEVEL 1

   FINAL PATH:

   💧 ─ ─ ┐
         │
         │
   ┌ ─ ─ ┘
   │
   └ ─ 😈
===================================================== */

const level1 = [

    /* ROW 1 */

    {type:"source",   rotation:0},
    {type:"straight", rotation:1},
    {type:"corner",   rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 2 */

    {type:"empty"},
    {type:"empty"},
    {type:"straight", rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 3 */

    {type:"empty"},
    {type:"empty"},
    {type:"straight", rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 4 */

    {type:"corner",   rotation:2},
    {type:"straight", rotation:1},
    {type:"corner",   rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 5 */

    {type:"straight", rotation:0},
    {type:"target",   rotation:0},
    {type:"empty"},
    {type:"empty"},
    {type:"empty"}

];


/* =====================================================
   LEVEL 2

   فعلاً آماده است ولی بعد از تأیید Level 1
   روی آن کار می‌کنیم.
===================================================== */

const level2 = [

    {type:"source",rotation:0},
    {type:"straight",rotation:1},
    {type:"corner",rotation:0},
    {type:"empty"},
    {type:"empty"},

    {type:"empty"},
    {type:"empty"},
    {type:"straight",rotation:0},
    {type:"empty"},
    {type:"empty"},

    {type:"empty"},
    {type:"empty"},
    {type:"corner",rotation:1},
    {type:"straight",rotation:1},
    {type:"empty"},

    {type:"empty"},
    {type:"empty"},
    {type:"empty"},
    {type:"corner",rotation:2},
    {type:"empty"},

    {type:"empty"},
    {type:"empty"},
    {type:"empty"},
    {type:"straight",rotation:1},
    {type:"target",rotation:0}

];


const levels=[
    level1,
    level2
];


let currentLevel=0;
let board=[];
let moves=0;
let finished=false;


/* =====================================================
   CONNECTIONS
===================================================== */

function getConnections(type,rotation){

    /* STRAIGHT */

    if(type==="straight"){

        if(rotation%2===0){

            return [
                true,
                false,
                true,
                false
            ];

        }else{

            return [
                false,
                true,
                false,
                true
            ];

        }

    }


    /* CORNER */

    if(type==="corner"){

        const shapes=[

            /* 0 = EAST + SOUTH */
            [false,true,true,false],

            /* 1 = SOUTH + WEST */
            [false,false,true,true],

            /* 2 = WEST + NORTH */
            [true,false,false,true],

            /* 3 = NORTH + EAST */
            [true,true,false,false]

        ];

        return shapes[rotation%4];

    }


    /* SOURCE */

    if(type==="source"){

        return [
            false,
            true,
            false,
            false
        ];

    }


    /* TARGET */

    if(type==="target"){

        return [
            false,
            false,
            false,
            true
        ];

    }


    return [
        false,
        false,
        false,
        false
    ];

}


/* =====================================================
   DRAW BOARD
===================================================== */

function draw(){

    const game=
        document.getElementById("game");

    game.innerHTML="";


    board.forEach((item,index)=>{

        const cell=
            document.createElement("div");

        cell.className="cell";


        /* SOURCE */

        if(item.type==="source"){

            cell.innerHTML=
                '<div class="source">💧</div>';

        }


        /* TARGET */

        else if(item.type==="target"){

            cell.innerHTML=
                '<div class="target">😈</div>';

        }


        /* STRAIGHT */

        else if(item.type==="straight"){

            const pipe=
                document.createElement("div");

            pipe.className="pipe straight";


            if(item.rotation%2===0){

                pipe.classList.add("vertical");

            }else{

                pipe.classList.add("horizontal");

            }


            cell.appendChild(pipe);

        }


        /* CORNER */

        else if(item.type==="corner"){

            const pipe=
                document.createElement("div");

            pipe.className=
                "pipe corner r"+
                (item.rotation%4);


            cell.appendChild(pipe);

        }


        cell.onclick=function(){

            rotate(index);

        };


        game.appendChild(cell);

    });

}


/* =====================================================
   ROTATE
===================================================== */

function rotate(index){

    if(finished)
        return;


    const item=board[index];


    if(
        item.type!=="straight" &&
        item.type!=="corner"
    ){

        return;
    }


    item.rotation=
        (item.rotation+1)%4;


    moves++;


    document.getElementById("moves")
        .textContent=moves;


    draw();

    checkPath();

}


/* =====================================================
   FIND PATH
===================================================== */

function findPath(){

    const start=
        board.findIndex(
            item=>item.type==="source"
        );


    const target=
        board.findIndex(
            item=>item.type==="target"
        );


    const queue=[start];

    const visited=
        new Set([start]);

    const parent={};


    const directions=[

        [-1,0],
        [0,1],
        [1,0],
        [0,-1]

    ];


    while(queue.length>0){

        const current=
            queue.shift();


        if(current===target){

            const path=[];

            let p=current;


            while(p!==undefined){

                path.unshift(p);

                p=parent[p];

            }


            return path;

        }


        const row=
            Math.floor(current/5);

        const col=
            current%5;


        const currentConnections=
            getConnections(
                board[current].type,
                board[current].rotation
            );


        for(let d=0;d<4;d++){

            if(!currentConnections[d])
                continue;


            const nextRow=
                row+directions[d][0];

            const nextCol=
                col+directions[d][1];


            if(
                nextRow<0 ||
                nextRow>=5 ||
                nextCol<0 ||
                nextCol>=5
            ){

                continue;

            }


            const next=
                nextRow*5+nextCol;


            if(visited.has(next))
                continue;


            if(board[next].type==="empty")
                continue;


            const opposite=
                (d+2)%4;


            const nextConnections=
                getConnections(
                    board[next].type,
                    board[next].rotation
                );


            if(!nextConnections[opposite])
                continue;


            visited.add(next);

            parent[next]=current;

            queue.push(next);

        }

    }


    return null;

}


/* =====================================================
   CHECK PATH
===================================================== */

function checkPath(){

    const path=findPath();


    if(!path)
        return;


    finished=true;


    animateWater(path);

}


/* =====================================================
   WATER ANIMATION
===================================================== */

function animateWater(path){

    const cells=
        document.querySelectorAll(".cell");


    let i=0;


    function next(){

        if(i>=path.length){

            setTimeout(
                completeLevel,
                500
            );

            return;

        }


        const drop=
            document.createElement("div");

        drop.className="water";


        cells[path[i]]
            .appendChild(drop);


        i++;


        setTimeout(
            next,
            300
        );

    }


    next();

}


/* =====================================================
   LEVEL COMPLETE
===================================================== */

function completeLevel(){

    document.getElementById("message")
        .textContent=
        "💦 Water reached the chamber!";


    let stars="★★★";


    if(moves>10)
        stars="★★☆";


    if(moves>20)
        stars="★☆☆";


    document.getElementById("stars")
        .textContent=stars;


    if(
        currentLevel<
        levels.length-1
    ){

        document.getElementById("next")
            .style.display="inline-block";

    }

}


/* =====================================================
   RESET
===================================================== */

document.getElementById("reset")
    .onclick=function(){

        loadLevel(currentLevel);

    };


/* =====================================================
   NEXT LEVEL
===================================================== */

document.getElementById("next")
    .onclick=function(){

        if(
            currentLevel<
            levels.length-1
        ){

            loadLevel(
                currentLevel+1
            );

        }

    };


/* =====================================================
   LOAD LEVEL
===================================================== */

function loadLevel(number){

    currentLevel=number;

    moves=0;

    finished=false;


    document.getElementById("levelTitle")
        .textContent=
        "Level "+(number+1);


    document.getElementById("moves")
        .textContent="0";


    document.getElementById("stars")
        .textContent="★★★";


    document.getElementById("message")
        .textContent="";


    document.getElementById("next")
        .style.display="none";


    board=
        levels[number].map(item=>({

            type:item.type,

            rotation:
                item.rotation||0

        }));


    draw();

}


/* =====================================================
   START
===================================================== */

loadLevel(0);

</script>

</body>
</html>
