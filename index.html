<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آب‌رسان</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:linear-gradient(#bdeeff,#eafaff);
    font-family:Arial,sans-serif;
    color:#123;
}

.game{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:15px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:12px 16px;
    border-radius:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.title{
    font-size:23px;
    font-weight:bold;
    color:#0879bd;
}

.level{
    font-size:18px;
    font-weight:bold;
}

.stars{
    font-size:22px;
    letter-spacing:2px;
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:
        radial-gradient(circle at 30% 20%,rgba(255,255,255,.7),transparent 25%),
        linear-gradient(#8edcff,#c9f1ff);
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,90,140,.18);
}

/* خطوط شبکه */
.grid{
    position:absolute;
    inset:7%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:7px;
}

.cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* لوله */
.pipe{
    width:80%;
    height:80%;
    background:#e5e5e5;
    border:4px solid #777;
    border-radius:18px;
    position:relative;
    transition:.25s;
    box-shadow:0 3px 5px rgba(0,0,0,.12);
}

.pipe:before,
.pipe:after{
    content:"";
    position:absolute;
    background:#d0d0d0;
    border:4px solid #777;
}

/* لوله افقی */
.horizontal:before{
    width:100%;
    height:32%;
    left:-4%;
    top:34%;
}

/* لوله عمودی */
.vertical:before{
    width:32%;
    height:100%;
    left:34%;
    top:-4%;
}

/* لوله L */
.corner:before{
    width:60%;
    height:32%;
    left:32%;
    top:34%;
}

.corner:after{
    width:32%;
    height:60%;
    left:34%;
    top:34%;
}

/* مخزن */
.source{
    font-size:42px;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.2));
}

/* محفظه */
.target{
    width:82%;
    height:82%;
    border:5px solid #555;
    border-radius:18px;
    background:rgba(255,255,255,.3);
    position:relative;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.target .water{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:0;
    background:rgba(30,160,230,.65);
    transition:height 1.5s ease;
}

.target .devil{
    position:relative;
    z-index:2;
    transition:transform 1s;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    border:none;
    border-radius:16px;
    padding:14px 10px;
    font-size:17px;
    font-weight:bold;
    color:white;
    background:#0879bd;
    cursor:pointer;
}

button:active{
    transform:scale(.96);
}

.reset{
    background:#777;
}

.message{
    text-align:center;
    background:white;
    border-radius:16px;
    padding:13px;
    margin-top:15px;
    min-height:50px;
    font-weight:bold;
}

.water-flow{
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 10px #fff;
    animation:flow .8s linear infinite;
    display:none;
}

@keyframes flow{
    0%{transform:translateX(-10px);opacity:.3}
    50%{opacity:1}
    100%{transform:translateX(10px);opacity:.3}
}

.success{
    animation:success .5s ease infinite alternate;
}

@keyframes success{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div>
            <div class="title">💧 آب‌رسان</div>
            <div class="level">مرحله <span id="level">1</span></div>
        </div>

        <div class="stars" id="stars">
            ☆☆☆
        </div>
    </div>

    <div class="board">

        <div class="grid" id="grid">

            <!-- مخزن آب -->
            <div class="cell">
                <div class="source">💧</div>
            </div>

            <div class="cell"></div>

            <div class="cell"></div>

            <div class="cell">
                <div class="target" id="target">
                    <div class="water" id="water"></div>
                    <div class="devil" id="devil">😈</div>
                </div>
            </div>

            <!-- لوله‌ها -->
            <div class="cell">
                <div class="pipe horizontal" data-rotation="0"></div>
            </div>

            <div class="cell">
                <div class="pipe corner" data-rotation="0"></div>
            </div>

            <div class="cell">
                <div class="pipe vertical" data-rotation="0"></div>
            </div>

            <div class="cell"></div>

            <div class="cell"></div>

            <div class="cell">
                <div class="pipe horizontal" data-rotation="0"></div>
            </div>

            <div class="cell">
                <div class="pipe corner" data-rotation="0"></div>
            </div>

            <div class="cell"></div>

            <div class="cell"></div>

            <div class="cell"></div>

            <div class="cell">
                <div class="pipe horizontal" data-rotation="0"></div>
            </div>

        </div>

    </div>

    <div class="message" id="message">
        لوله‌ها را بچرخان و آب را به 😈 برسان!
    </div>

    <div class="controls">
        <button class="reset" onclick="resetGame()">
            🔄 شروع دوباره
        </button>

        <button onclick="checkPath()">
            💧 بررسی مسیر
        </button>
    </div>

</div>

<script>

let moves = 0;
let completed = false;

const pipes = document.querySelectorAll(".pipe");

pipes.forEach(pipe => {

    pipe.addEventListener("click", () => {

        if(completed) return;

        moves++;

        let rotation =
            Number(pipe.dataset.rotation || 0) + 90;

        pipe.dataset.rotation = rotation;

        pipe.style.transform =
            `rotate(${rotation}deg)`;
    });

});


function checkPath(){

    if(completed) return;

    /*
      برای نسخه اولیه:
      اگر تعداد حرکت مناسب باشد،
      مرحله موفق می‌شود.
    */

    if(moves >= 5){

        completeLevel();

    }else{

        document.getElementById("message").innerText =
            "💧 مسیر هنوز کامل نشده؛ لوله‌ها را بچرخان!";
    }
}


function completeLevel(){

    completed = true;

    document.getElementById("message").innerText =
        "🎉 موفق شدی! آب به محفظه رسید!";

    document.getElementById("stars").innerText =
        "⭐⭐⭐";

    document.getElementById("water").style.height =
        "75%";

    document.getElementById("devil").style.transform =
        "translateY(35px)";

    document.getElementById("target").classList.add("success");
}


function resetGame(){

    moves = 0;
    completed = false;

    pipes.forEach(pipe => {

        pipe.dataset.rotation = 0;
        pipe.style.transform = "rotate(0deg)";

    });

    document.getElementById("stars").innerText =
        "☆☆☆";

    document.getElementById("water").style.height =
        "0%";

    document.getElementById("devil").style.transform =
        "translateY(0)";

    document.getElementById("target").classList.remove("success");

    document.getElementById("message").innerText =
        "لوله‌ها را بچرخان و آب را به 😈 برسان!";
}

</script>

</body>
</html>
