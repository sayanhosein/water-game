<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Runner</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#101827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:20px 0 5px;
    font-size:30px;
}

.level{
    color:#65cfff;
    font-size:22px;
    margin-bottom:12px;
}

.info{
    display:flex;
    justify-content:center;
    gap:35px;
    font-size:20px;
    margin-bottom:16px;
}

#game{
    width:360px;
    max-width:94vw;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.cell{
    aspect-ratio:1;
    background:#1d293b;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
}

.source{
    font-size:36px;
}

.target{
    font-size:34px;
}

.pipe{
    width:72%;
    height:72%;
    position:relative;
}

.pipe::before,
.pipe::after{
    content:"";
    position:absolute;
    background:#59caff;
    border-radius:10px;
}

/* STRAIGHT */

.straight.vertical::before{
    width:25%;
    height:100%;
    left:37.5%;
    top:0;
}

.straight.horizontal::before{
    width:100%;
    height:25%;
    left:0;
    top:37.5%;
}

/* CORNER NE */

.corner.ne::before{
    width:25%;
    height:75%;
    left:37.5%;
    top:0;
}

.corner.ne::after{
    width:75%;
    height:25%;
    left:25%;
    top:37.5%;
}

/* CORNER SE */

.corner.se::before{
    width:25%;
    height:75%;
    left:37.5%;
    top:25%;
}

.corner.se::after{
    width:75%;
    height:25%;
    left:25%;
    top:37.5%;
}

/* CORNER SW */

.corner.sw::before{
    width:25%;
    height:75%;
    left:37.5%;
    top:25%;
}

.corner.sw::after{
    width:75%;
    height:25%;
    left:0;
    top:37.5%;
}

/* CORNER NW */

.corner.nw::before{
    width:25%;
    height:75%;
    left:37.5%;
    top:0;
}

.corner.nw::after{
    width:75%;
    height:25%;
    left:0;
    top:37.5%;
}

/* WATER */

.water{
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#65e0ff;
    box-shadow:0 0 14px #65e0ff;
    z-index:20;
}

/* BUTTONS */

button{
    border:0;
    border-radius:12px;
    padding:14px 30px;
    margin:20px 5px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#reset{
    background:#34455c;
    color:white;
}

#next{
    background:#19a974;
    color:white;
    display:none;
}

#message{
    min-height:30px;
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>💧 Water Runner</h1>

<div class="level" id="levelTitle">
    Level 1
</div>

<div class="info">
    <div>
        Moves: <span id="moves">0</span>
    </div>

    <div>
        Stars: <span id="stars">★★★</span>
    </div>
</div>

<div id="game"></div>

<div id="message"></div>

<button id="reset">RESET</button>

<button id="next">NEXT LEVEL</button>


<script>

/* =====================================
   DIRECTIONS

   0 = NORTH
   1 = EAST
   2 = SOUTH
   3 = WEST
===================================== */


/* =====================================
   LEVEL 1

   FINAL PATH:

   💧 ─ ─ ┐
         │
         │
   ┌ ─ ─ ┘
   │ 😈
===================================== */

const level1 = [

    /* ROW 1 */

    {type:"source",  rotation:0},
    {type:"straight",rotation:0},
    {type:"corner",  rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 2 */

    {type:"empty"},
    {type:"empty"},
    {type:"straight",rotation:1},
    {type:"empty"},
    {type:"empty"},


    /* ROW 3 */

    {type:"empty"},
    {type:"empty"},
    {type:"straight",rotation:1},
    {type:"empty"},
    {type:"empty"},


    /* ROW 4 */

    {type:"corner",  rotation:3},
    {type:"straight",rotation:0},
    {type:"corner",  rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 5 */

    {type:"straight",rotation:1},
    {type:"target",rotation:0},
    {type:"empty"},
    {type:"empty"},
    {type:"empty"}
];


/* =====================================
   LEVEL 2

   مسیر دوم
===================================== */

const level2 = [

    /* ROW 1 */

    {type:"source",rotation:0},
    {type:"straight",rotation:0},
    {type:"corner",rotation:0},
    {type:"empty"},
    {type:"empty"},


    /* ROW 2 */

    {type:"empty"},
    {type:"empty"},
    {type:"straight",rotation:1},
    {type:"empty"},
    {type:"empty"},


    /* ROW 3 */

    {type:"empty"},
    {type:"empty"},
    {type:"corner",rotation:0},
    {type:"straight",rotation:0},
    {type:"empty"},


    /* ROW 4 */

    {type:"empty"},
    {type:"empty"},
    {type:"empty"},
    {type:"corner",rotation:0},
    {type:"empty"},


    /* ROW 5 */

    {type:"empty"},
    {type:"empty"},
    {type:"empty"},
    {type:"straight",rotation:0},
    {type:"target",rotation:0}
];


const levels = [
    level1,
    level2
];


let currentLevel = 0;
let board = [];
let moves = 0;
let finished = false;


/* =====================================
   CONNECTION LOGIC
===================================== */

function getConnections(type, rotation){

    if(type === "straight"){

        if(rotation % 2 === 0){

            return [
                true,   // NORTH
                false,  // EAST
                true,   // SOUTH
                false   // WEST
            ];

        }else{

            return [
                false,
                true,
                false,
                true
            ];

        }
    }


    if(type === "corner"){

        const shapes = [

            /* 0 = NORTH + EAST */
            [true,true,false,false],

            /* 1 = EAST + SOUTH */
            [false,true,true,false],

            /* 2 = SOUTH + WEST */
            [false,false,true,true],

            /* 3 = WEST + NORTH */
            [true,false,false,true]

        ];

        return shapes[rotation % 4];
    }


    if(type === "source"){

        /* Water leaves source to the EAST */

        return [
            false,
            true,
            false,
            false
        ];
    }


    if(type === "target"){

        /* Target receives water from WEST */

        return [
            false,
            false,
            false,
            true
        ];
    }


    return [
        false,
        false,
        false,
        false
    ];
}


/* =====================================
   DRAW
===================================== */

function draw(){

    const game = document.getElementById("game");

    game.innerHTML = "";


    board.forEach((item,index)=>{

        const cell = document.createElement("div");

        cell.className = "cell";


        if(item.type === "source"){

            cell.innerHTML =
                '<div class="source">💧</div>';

        }


        else if(item.type === "target"){

            cell.innerHTML =
                '<div class="target">😈</div>';

        }


        else if(item.type === "straight"){

            const pipe =
                document.createElement("div");

            pipe.className = "pipe straight";


            if(item.rotation % 2 === 0){

                pipe.classList.add("vertical");

            }else{

                pipe.classList.add("horizontal");

            }


            cell.appendChild(pipe);
        }


        else if(item.type === "corner"){

            const pipe =
                document.createElement("div");

            pipe.className = "pipe corner";


            const names = [
                "ne",
                "se",
                "sw",
                "nw"
            ];


            pipe.classList.add(
                names[item.rotation % 4]
            );


            cell.appendChild(pipe);
        }


        cell.onclick = function(){

            rotate(index);

        };


        game.appendChild(cell);

    });
}


/* =====================================
   ROTATE
===================================== */

function rotate(index){

    if(finished)
        return;


    const item = board[index];


    if(
        item.type !== "straight" &&
        item.type !== "corner"
    ){

        return;
    }


    item.rotation =
        (item.rotation + 1) % 4;


    moves++;


    document.getElementById("moves")
        .textContent = moves;


    draw();

    check();
}


/* =====================================
   FIND PATH
===================================== */

function findPath(){

    const start =
        board.findIndex(
            item => item.type === "source"
        );


    const target =
        board.findIndex(
            item => item.type === "target"
        );


    const queue = [start];

    const visited =
        new Set([start]);


    const parent = {};


    const directions = [

        [-1,0],  // NORTH
        [0,1],    // EAST
        [1,0],    // SOUTH
        [0,-1]    // WEST

    ];


    while(queue.length > 0){

        const current =
            queue.shift();


        if(current === target){

            const path = [];

            let p = current;


            while(p !== undefined){

                path.unshift(p);

                p = parent[p];

            }


            return path;
        }


        const row =
            Math.floor(current / 5);

        const col =
            current % 5;


        const currentItem =
            board[current];


        const connections =
            getConnections(
                currentItem.type,
                currentItem.rotation
            );


        for(let d=0; d<4; d++){

            if(!connections[d])
                continue;


            const nextRow =
                row + directions[d][0];

            const nextCol =
                col + directions[d][1];


            if(
                nextRow < 0 ||
                nextRow >= 5 ||
                nextCol < 0 ||
                nextCol >= 5
            ){

                continue;
            }


            const next =
                nextRow * 5 + nextCol;


            if(visited.has(next))
                continue;


            const nextItem =
                board[next];


            if(
                !nextItem ||
                nextItem.type === "empty"
            ){

                continue;
            }


            const opposite =
                (d + 2) % 4;


            const nextConnections =
                getConnections(
                    nextItem.type,
                    nextItem.rotation
                );


            if(!nextConnections[opposite])
                continue;


            visited.add(next);

            parent[next] = current;

            queue.push(next);
        }
    }


    return null;
}


/* =====================================
   CHECK
===================================== */

function check(){

    const path = findPath();


    if(!path)
        return;


    finished = true;

    animateWater(path);
}


/* =====================================
   WATER ANIMATION
===================================== */

function animateWater(path){

    const cells =
        document.querySelectorAll(".cell");


    let i = 0;


    function moveWater(){

        if(i >= path.length){

            setTimeout(
                completeLevel,
                500
            );

            return;
        }


        const drop =
            document.createElement("div");

        drop.className = "water";


        cells[path[i]]
            .appendChild(drop);


        i++;


        setTimeout(
            moveWater,
            250
        );
    }


    moveWater();
}


/* =====================================
   COMPLETE LEVEL
===================================== */

function completeLevel(){

    document.getElementById("message")
        .textContent =
        "💦 Water reached the chamber!";


    let stars = "★★★";


    if(moves > 15)
        stars = "★★☆";


    if(moves > 25)
        stars = "★☆☆";


    document.getElementById("stars")
        .textContent = stars;


    if(currentLevel < levels.length - 1){

        document.getElementById("next")
            .style.display = "inline-block";
    }
}


/* =====================================
   RESET
===================================== */

document.getElementById("reset")
    .onclick = function(){

        loadLevel(currentLevel);

    };


/* =====================================
   NEXT LEVEL
===================================== */

document.getElementById("next")
    .onclick = function(){

        if(currentLevel < levels.length - 1){

            loadLevel(currentLevel + 1);

        }
    };


/* =====================================
   LOAD LEVEL
===================================== */

function loadLevel(number){

    currentLevel = number;

    moves = 0;

    finished = false;


    document.getElementById("levelTitle")
        .textContent =
        "Level " + (number + 1);


    document.getElementById("moves")
        .textContent = "0";


    document.getElementById("stars")
        .textContent = "★★★";


    document.getElementById("message")
        .textContent = "";


    document.getElementById("next")
        .style.display = "none";


    board =
        levels[number].map(item => ({

            type:item.type,

            rotation:
                item.rotation || 0

        }));


    draw();
}


/* =====================================
   START
===================================== */

loadLevel(0);

</script>

</body>
</html>
